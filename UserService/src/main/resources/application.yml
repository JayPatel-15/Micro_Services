spring:
  application:
    name: User-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/hotelRating
    username: postgres
    password: postgres#1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082